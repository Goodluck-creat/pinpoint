<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinPoint — Track your delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #FAFBFC;
    --surface: #FFFFFF;
    --ink: #16302A;
    --slate: #64748B;
    --slate-light: #94A3B8;
    --border: #E5E9F0;
    --brand: #16302A;
    --brand-light: #1F4239;
    --cream: #F7F3EA;
    --cream-dim: #C7D6CC;
    --primary: #E8A33D;
    --primary-dark: #D68A28;
    --primary-tint: #FDF3E2;
    --live: #16A34A;
    --live-tint: #ECFDF3;
    --warn: #F59E0B;
    --warn-tint: #FFF7E6;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  h1, h2, h3, .display {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    background: var(--brand);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), #F4C06B);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-name { font-size: 16px; font-weight: 700; color: #fff; }

  .container {
    width: 100%;
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  .empty-state {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 50px 24px;
    text-align: center;
    color: var(--slate);
    font-size: 14px;
    margin-top: 40px;
  }

  /* ---------- Delivery header card ---------- */
  .delivery-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .delivery-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .delivery-code { font-size: 13px; color: var(--slate); }

  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag.assigned { background: #FFF7E6; color: #B7791F; }
  .tag.accepted { background: var(--primary-tint); color: var(--primary); }
  .tag.live { background: var(--live-tint); color: #067A5C; }
  .tag.delivered { background: #F1F5F9; color: var(--slate); }
  .tag.failed { background: #FEF2F2; color: #B91C1C; }

  .rider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .rider-avatar-sm {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--primary-tint);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .rider-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

  .rider-name { font-size: 14px; font-weight: 600; }
  .rider-vehicle { font-size: 12px; color: var(--slate); }

  /* ---------- Map ---------- */
  /* ---------- Full-screen map hero ---------- */
  .map-hero {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px); /* fills the screen below the slim brand header */
    background: #E5E9F0;
  }

  #map {
    width: 100%;
    height: 100%;
  }

  .map-overlay-top {
    position: absolute;
    top: 14px; left: 14px; right: 14px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .map-overlay-top > * { pointer-events: auto; }

  .floating-card {
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 8px 24px rgba(15,23,42,0.12);
  }

  .map-overlay-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: var(--surface);
    border-radius: 22px 22px 0 0;
    box-shadow: 0 -8px 30px rgba(15,23,42,0.15);
    padding: 18px 18px 22px;
    max-height: 60vh;
    overflow-y: auto;
  }

  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 100px;
    margin: 0 auto 14px;
  }

  .below-fold-content {
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 50px;
  }

  .rider-marker-wrap {
    position: relative;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rider-marker-ring {
    position: absolute;
    width: 64px; height: 64px;
    border-radius: 50%;
    background: rgba(36, 84, 255, 0.18);
    animation: ring-pulse 1.8s infinite ease-out;
  }

  @keyframes ring-pulse {
    0% { transform: scale(0.7); opacity: 0.8; }
    100% { transform: scale(1.3); opacity: 0; }
  }

  .rider-marker {
    position: relative;
    width: 52px; height: 52px;
    border-radius: 50%;
    border: 3.5px solid var(--primary);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(36,84,255,0.4);
    overflow: hidden;
    font-size: 24px;
    z-index: 1;
  }
  .rider-marker img { width: 100%; height: 100%; object-fit: cover; }

  .vehicle-badge {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--ink);
    border: 2px solid var(--surface);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    z-index: 2;
  }
  .vehicle-badge svg { width: 12px; height: 12px; }

  .heading-arrow {
    position: absolute;
    width: 64px; height: 64px;
    transition: transform 0.4s ease;
    z-index: 0;
  }

  /* ---------- Stats row ---------- */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-light);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ---------- Wrong direction banner ---------- */
  .wrong-direction-banner {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #B91C1C;
  }
  .wrong-direction-banner.visible {
    display: flex;
    background: rgba(254,242,242,0.97);
    border: 1.5px solid #FCA5A5;
  }
  .wrong-direction-banner svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- Consent request button ---------- */
  .track-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .track-btn:hover { background: var(--primary-dark); }
  .track-btn:disabled { background: var(--slate-light); cursor: not-allowed; }

  .waiting-note {
    text-align: center;
    font-size: 13px;
    color: var(--slate);
    padding: 12px;
    background: var(--primary-tint);
    border-radius: 10px;
    margin-bottom: 14px;
  }

  .live-note {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #067A5C;
    background: var(--live-tint);
    padding: 10px 14px;
    border-radius: 9px;
    margin-bottom: 14px;
  }

  .pulse-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--live);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 200, 150, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(0, 200, 150, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 200, 150, 0); }
  }

  .route-text {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.5;
  }
  .route-text .label { color: var(--slate-light); }

  .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    background: #25D366;
    color: #fff;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
  }
  .whatsapp-btn:hover { background: #1EBE59; }
  .whatsapp-btn svg { width: 17px; height: 17px; fill: #fff; flex-shrink: 0; }

  /* ---------- Handoff PIN ---------- */
  .pin-card {
    background: var(--ink);
    border-radius: 12px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .pin-card-label { font-size: 12px; color: #94A3B8; }
  .pin-card-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.15em;
  }

  .landmark-line {
    font-size: 12px;
    color: var(--slate-light);
    margin-top: 2px;
  }

  /* ---------- Voice notes ---------- */
  .updates-list { margin-bottom: 14px; }
  .update-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .update-item audio { flex: 1; height: 32px; }
  .update-time { font-size: 11px; color: var(--slate-light); white-space: nowrap; }

  /* ---------- Help us improve (post-delivery) ---------- */
  .improve-location-card {
    background: var(--primary-tint);
    border: 1px solid #F3D9A8;
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .improve-location-card h3 { font-size: 14px; margin-bottom: 6px; color: var(--primary-dark); }
  .improve-location-card p { font-size: 13px; color: var(--slate); line-height: 1.5; margin-bottom: 14px; }
  .improve-location-btn {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .improve-location-btn:hover { background: var(--primary-dark); }
  .improve-location-btn:disabled { background: var(--slate-light); cursor: not-allowed; }
  .improve-location-msg {
    font-size: 12px;
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 8px;
    display: none;
  }
  .improve-location-msg.error { display: block; background: #FEF2F2; color: #B91C1C; }

  .improve-location-card.done {
    background: var(--live-tint);
    border-color: #A7E8C4;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #067A3E;
    padding: 14px 18px;
  }
  .improve-location-card.done svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* ---------- Rating ---------- */
  .rating-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    text-align: center;
  }
  .rating-card h3 { font-size: 15px; margin-bottom: 12px; }
  .star-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 14px; }
  .star-btn {
    font-size: 30px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--border);
    transition: color 0.15s ease;
  }
  .star-btn.filled { color: #F59E0B; }
  .rating-card textarea {
    width: 100%;
    padding: 10px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    resize: vertical;
    min-height: 50px;
    margin-bottom: 10px;
  }
  .rating-submit-btn {
    width: 100%;
    padding: 11px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ---------- Proof photo ---------- */
  .proof-photo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .proof-photo-card img { width: 100%; border-radius: 10px; }
  .proof-photo-label { font-size: 12px; color: var(--slate); margin-bottom: 8px; font-weight: 600; }

  /* ---------- Recap card ---------- */
  .recap-card {
    background: linear-gradient(135deg, var(--primary), #F4C06B);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 14px;
    color: #fff;
    text-align: center;
  }
  .recap-card .recap-title { font-size: 13px; opacity: 0.85; margin-bottom: 6px; }
  .recap-card .recap-time { font-size: 30px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin-bottom: 4px; }
  .recap-card .recap-sub { font-size: 13px; opacity: 0.85; margin-bottom: 16px; }
  .recap-share-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.2);
    color: #fff;
    padding: 10px 18px;
    border-radius: 9px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
  }
  .recap-share-btn svg { width: 15px; height: 15px; fill: #fff; }
</style>
</head>

<header>
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8z" fill="white"/><circle cx="12" cy="10" r="3" fill="#16302A"/></svg>
  </div>
  <span class="brand-name">PinPoint</span>
</header>

<div class="container" id="container">
  <div class="empty-state" id="loading-state">Looking up your delivery…</div>
</div>

<script>
  // ====== CONFIGURE THIS (same project as business.html / rider.html) ======
  const SUPABASE_URL = 'https://wtxikghyylclqnhxfcvu.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_3XEbw4-lAFfIVgG-haVbGQ_Q2305QI7';
  // ============================================================================

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const container = document.getElementById('container');
  const params = new URLSearchParams(window.location.search);
  const deliveryCode = params.get('code');

  let delivery = null;
  let realtimeChannel = null;
  let pollTimer = null;
  let offRouteStreak = 0; // counts consecutive "off route" pings

  const statusLabels = {
    assigned: 'Assigned',
    accepted: 'Accepted',
    tracking_requested: 'Tracking requested',
    tracking_approved: 'Tracking live',
    picked_up: 'Picked up',
    in_transit: 'In transit',
    arriving: 'Arriving',
    delivered: 'Delivered',
    failed: 'Failed'
  };

  function tagClass(d) {
    if (d.status === 'failed') return 'failed';
    if (d.status === 'delivered') return 'delivered';
    if (d.tracking_approved) return 'live';
    if (d.status === 'assigned') return 'assigned';
    return 'accepted';
  }

  async function getRiderMagicLink(email) {
    try {
      const { data, error } = await supabaseClient.functions.invoke('generate-rider-link', {
        body: { email, redirectTo: window.location.origin + '/rider.html' }
      });
      if (error || !data || !data.link) {
        return window.location.origin + '/rider.html';
      }
      return data.link;
    } catch (e) {
      return window.location.origin + '/rider.html';
    }
  }

  function toWhatsAppNumber(phone) {
    if (!phone) return null;
    let digits = phone.replace(/\D/g, '');
    if (digits.startsWith('0')) {
      digits = '234' + digits.slice(1);
    } else if (!digits.startsWith('234')) {
      digits = '234' + digits;
    }
    return digits;
  }

  function whatsappButton(phone, message, label) {
    const number = toWhatsAppNumber(phone);
    if (!number) return '';
    const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
    return `
      <a href="${url}" target="_blank" class="whatsapp-btn">
        <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m0 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.188 8.188 0 01-1.25-4.37c0-4.54 3.7-8.25 8.25-8.25M8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.86.84-.86 2.05 0 1.21.88 2.38 1 2.54.12.17 1.74 2.67 4.28 3.74.6.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.17-.48-.29-.25-.13-1.46-.72-1.69-.8-.23-.08-.39-.13-.56.13-.16.25-.64.8-.78.97-.15.16-.29.18-.54.06-.25-.13-1.05-.39-2-1.24-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.12-.14.16-.25.24-.41.08-.17.04-.31-.02-.44-.06-.13-.56-1.36-.78-1.85-.2-.48-.41-.42-.56-.43-.15-.01-.32-.01-.48-.01z"/></svg>
        ${label || 'Send via WhatsApp'}
      </a>`;
  }

  // ---------- Distance / geo helpers ----------
  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // Perpendicular distance (km) from a point to the straight line between two points
  function distanceFromRouteKm(lat, lng, lat1, lng1, lat2, lng2) {
    const d13 = haversineKm(lat1, lng1, lat, lng);
    const bearing13 = bearing(lat1, lng1, lat, lng);
    const bearing12 = bearing(lat1, lng1, lat2, lng2);
    const angle = (bearing13 - bearing12) * Math.PI / 180;
    return Math.abs(Math.asin(Math.sin(d13 / 6371) * Math.sin(angle)) * 6371);
  }

  function bearing(lat1, lng1, lat2, lng2) {
    const y = Math.sin((lng2 - lng1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lng2 - lng1) * Math.PI / 180);
    return Math.atan2(y, x) * 180 / Math.PI;
  }

  // ---------- Load delivery ----------
  async function loadDelivery() {
    if (!deliveryCode) {
      container.innerHTML = `<div class="empty-state">No delivery code provided. Check the link and try again.</div>`;
      return;
    }

    const { data, error } = await supabaseClient
      .from('deliveries')
      .select('*, riders(name, photo_url, vehicle_type, phone, email)')
      .eq('delivery_code', deliveryCode)
      .limit(1);

    if (error || !data || data.length === 0) {
      container.innerHTML = `<div class="empty-state">We couldn't find a delivery with code ${deliveryCode}.</div>`;
      return;
    }

    delivery = data[0];
    renderPage();
    loadUpdates();
    subscribeToUpdates();

    if (!pollTimer) {
      pollTimer = setInterval(refreshDeliveryStatus, 4000);
    }
  }

  async function refreshDeliveryStatus() {
    const { data } = await supabaseClient
      .from('deliveries')
      .select('*, riders(name, photo_url, vehicle_type, phone, email)')
      .eq('delivery_code', deliveryCode)
      .limit(1);
    if (data && data.length > 0) {
      const wasApproved = delivery.tracking_approved;

        pinCard.remove();
      }

      if (delivery.tracking_approved && !wasApproved) {
        startLiveTracking();
      }
    }
  }

  // ---------- Post-delivery: help improve the address book ----------
  function haversineKmLocal(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  async function reverseGeocodeCustomer(lat, lng) {
    try {
      const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`;
      const res = await fetch(url);
      const data = await res.json();
      const addr = data.address || {};
      return {
        displayName: data.display_name || null,
        state: addr.state || null,
        lga: addr.county || addr.state_district || addr.city || null
      };
    } catch (e) { return { displayName: null, state: null, lga: null }; }
  }

  function lgaPrefix(lga) {
    if (!lga) return 'NGA';
    const cleaned = lga.replace(/[^a-zA-Z]/g, '').toUpperCase();
    return cleaned.slice(0, 3) || 'NGA';
  }

  async function generatePinCode(prefix) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for (let attempt = 0; attempt < 5; attempt++) {
      let suffix = '';
      for (let i = 0; i < 4; i++) suffix += chars[Math.floor(Math.random() * chars.length)];
      const code = `PIN-${prefix}-${suffix}`;
      const { data } = await supabaseClient.from('locations').select('id').eq('pin_code', code).limit(1);
      if (!data || data.length === 0) return code;
    }
    return `PIN-${prefix}-${Date.now().toString(36).toUpperCase().slice(-4)}`;
  }

  function renderImproveLocationCard() {
    const area = document.getElementById('improve-location-area');
    if (!area) return;

    const savedCode = sessionStorage.getItem(`location-code-${delivery.id}`);
    if (sessionStorage.getItem(`location-shared-${delivery.id}`)) {
      area.innerHTML = `
        <div class="improve-location-card done">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M12 2a10 10 0 100 20 10 10 0 000-20z"/></svg>
          ${savedCode ? `Thanks! Your PinPoint code is <strong>${savedCode}</strong> — share it next time instead of a full address.` : 'Thanks for helping us improve delivery accuracy in your area!'}
        </div>`;
      return;
    }

    area.innerHTML = `
      <div class="improve-location-card">
        <h3>Help us serve you better next time</h3>
        <p>Confirm your exact location so future deliveries to you (and your neighbours) are even more accurate — and get a reusable PinPoint code for this address. Completely optional.</p>
        <button class="improve-location-btn" id="improve-location-btn">Share my exact location</button>
        <div class="improve-location-msg" id="improve-location-msg"></div>
      </div>`;

    document.getElementById('improve-location-btn').addEventListener('click', () => {
      const btn = document.getElementById('improve-location-btn');
      const msg = document.getElementById('improve-location-msg');

      if (!navigator.geolocation) {
        msg.textContent = "Your browser doesn't support location sharing.";
        msg.className = 'improve-location-msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Getting your location…';

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const { latitude, longitude } = position.coords;

          // Skip saving if a very similar spot is already in the shared address book
          const { data: nearby } = await supabaseClient.from('locations').select('id, lat, lng, pin_code')
            .gte('lat', latitude - 0.003).lte('lat', latitude + 0.003)
            .gte('lng', longitude - 0.003).lte('lng', longitude + 0.003);
          const duplicate = (nearby || []).find(loc => haversineKmLocal(latitude, longitude, loc.lat, loc.lng) < 0.1);

          let finalCode = null;
          if (duplicate) {
            finalCode = duplicate.pin_code;
          } else {
            const geo = await reverseGeocodeCustomer(latitude, longitude);
            const address = geo.displayName || delivery.destination_address;
            finalCode = await generatePinCode(lgaPrefix(geo.lga));
            await supabaseClient.from('locations').insert({
              name: address, lat: latitude, lng: longitude, pin_code: finalCode,
              state: geo.state, lga: geo.lga
            });
          }

          if (finalCode) sessionStorage.setItem(`location-code-${delivery.id}`, finalCode);
          sessionStorage.setItem(`location-shared-${delivery.id}`, 'true');
          renderImproveLocationCard();
        },
        () => {
          btn.disabled = false;
          btn.textContent = 'Share my exact location';
          msg.textContent = 'Location access was denied — no problem, this was optional.';
          msg.className = 'improve-location-msg error';
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    });
  }

  function subscribeToUpdates() {

  // ---------- Map ----------
  const vehicleIcons = {
    bike: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2zM12 17.5V14l-3-3 4-3 2 3h2"/></svg>',
    car: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17H3v-6l2-5h9l4 5h1a2 2 0 012 2v4h-2"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="17.5" r="2.5"/></svg>',
    foot: '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"/><path d="M12 6v5l-3 8M12 11l3 8M9 13h6"/></svg>'
  };

  // ---------- Real live map (Leaflet + OpenStreetMap) ----------
  let map = null;
  let riderMarker = null;

  // Fetches the actual road-following path between two points using OSRM's free
  // public routing service — no API key needed, just route geometry.
  async function fetchRoadRoute(lat1, lng1, lat2, lng2) {
    try {
      const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
      const res = await fetch(url);
      const data = await res.json();
      if (data.routes && data.routes[0]) {
        return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
      }
    } catch (e) {
      console.warn('Road route fetch failed, falling back to straight line:', e);
    }
    return null;
  }

  async function initMap() {
    const hasPickup = delivery.pickup_lat && delivery.pickup_lng;
    const hasDestination = delivery.destination_lat && delivery.destination_lng;
    const centerLat = hasDestination ? delivery.destination_lat : (hasPickup ? delivery.pickup_lat : 6.2104);
    const centerLng = hasDestination ? delivery.destination_lng : (hasPickup ? delivery.pickup_lng : 7.0716);

    map = L.map('map').setView([centerLat, centerLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    setTimeout(() => map.invalidateSize(), 200);

    if (hasPickup) {
      L.circleMarker([delivery.pickup_lat, delivery.pickup_lng], {
        radius: 7, color: '#16302A', fillColor: '#16302A', fillOpacity: 1
      }).addTo(map).bindPopup('Pickup');
    }
    if (hasDestination) {
      L.circleMarker([delivery.destination_lat, delivery.destination_lng], {
        radius: 7, color: '#16A34A', fillColor: '#16A34A', fillOpacity: 1
      }).addTo(map).bindPopup('Destination');
    }

    if (hasPickup && hasDestination) {
      // Draw a straight line immediately, then replace it with the real road-following
      // route once OSRM responds, so the map never sits empty while waiting.
      const straightLine = L.polyline(
        [[delivery.pickup_lat, delivery.pickup_lng], [delivery.destination_lat, delivery.destination_lng]],
        { color: '#E8A33D', weight: 3, dashArray: '6 8', opacity: 0.5 }
      ).addTo(map);
      map.fitBounds([[delivery.pickup_lat, delivery.pickup_lng], [delivery.destination_lat, delivery.destination_lng]], { padding: [30, 30] });

      const route = await fetchRoadRoute(delivery.pickup_lat, delivery.pickup_lng, delivery.destination_lat, delivery.destination_lng);
      if (route) {
        map.removeLayer(straightLine);
        const roadLine = L.polyline(route, { color: '#E8A33D', weight: 4, opacity: 0.65 }).addTo(map);
        map.fitBounds(roadLine.getBounds(), { padding: [30, 30] });
      }
    }

    if (delivery.tracking_approved) {
      startLiveTracking();
    }
  }

  function riderDivIcon() {
    const rider = delivery.riders || {};
    const vehicleIcon = vehicleIcons[rider.vehicle_type] || vehicleIcons.bike;
    const content = rider.photo_url ? `<img src="${rider.photo_url}">` : `<div style="width:60%;height:60%;">${vehicleIcon}</div>`;
    const badge = rider.photo_url ? `<div class="vehicle-badge">${vehicleIcon}</div>` : '';

    return L.divIcon({
      html: `
        <div class="rider-marker-wrap">
          <div class="rider-marker-ring"></div>
          <svg class="heading-arrow" id="rider-heading-arrow" viewBox="0 0 64 64">
            <path d="M32 2 L40 20 L32 15 L24 20 Z" fill="#E8A33D" opacity="0.9"/>
          </svg>
          <div class="rider-marker">${content}</div>
          ${badge}
        </div>`,
      className: '',
      iconSize: [64, 64],
      iconAnchor: [32, 32]
    });
  }

  function updateStats(lat, lng, speedMs) {
    if (!delivery.destination_lat || !delivery.destination_lng) return;
    const distKm = haversineKm(lat, lng, delivery.destination_lat, delivery.destination_lng);
    document.getElementById('stat-distance').textContent = distKm < 1
      ? `${Math.round(distKm * 1000)} m`
      : `${distKm.toFixed(1)} km`;

    const speedKmh = (speedMs && speedMs > 1) ? speedMs * 3.6 : 20;
    const etaMinutes = Math.max(1, Math.round((distKm / speedKmh) * 60));
    document.getElementById('stat-eta').textContent = `${etaMinutes} min`;
  }

  function checkWrongDirection(lat, lng) {
    const banner = document.getElementById('wrong-direction-banner');
    if (!banner) return;
    if (!delivery.pickup_lat || !delivery.destination_lat) return;

    const offsetKm = distanceFromRouteKm(
      lat, lng,
      delivery.pickup_lat, delivery.pickup_lng,
      delivery.destination_lat, delivery.destination_lng
    );

    if (offsetKm > 0.35) { offRouteStreak++; } else { offRouteStreak = 0; }
    banner.classList.toggle('visible', offRouteStreak >= 3);
  }

  function startLiveTracking() {
    if (!map) return;
    if (!riderMarker) {
      const startLat = delivery.pickup_lat || 6.2104;
      const startLng = delivery.pickup_lng || 7.0716;
      riderMarker = L.marker([startLat, startLng], { icon: riderDivIcon() }).addTo(map);
    }

    fetchLatestPing();
    if (realtimeChannel) return; // already subscribed

    realtimeChannel = supabaseClient
      .channel(`location-${delivery.id}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'location_pings', filter: `delivery_id=eq.${delivery.id}` },
        (payload) => applyPing(payload.new)
      )
      .subscribe();
  }

  async function fetchLatestPing() {
    const { data } = await supabaseClient
      .from('location_pings')
      .select('*')
      .eq('delivery_id', delivery.id)
      .order('created_at', { ascending: false })
      .limit(1);
    if (data && data.length > 0) applyPing(data[0]);
  }

  function applyPing(ping) {
    if (!riderMarker) return;
    riderMarker.setLatLng([ping.lat, ping.lng]);
    map.panTo([ping.lat, ping.lng]);
    updateStats(ping.lat, ping.lng, ping.speed);
    checkWrongDirection(ping.lat, ping.lng);

    if (ping.heading !== null && ping.heading !== undefined) {
      const markerEl = riderMarker.getElement();
      if (markerEl) {
        const arrow = markerEl.querySelector('#rider-heading-arrow');
        if (arrow) {
          arrow.style.transform = `rotate(${ping.heading}deg)`;
          arrow.style.transformOrigin = '32px 32px';
        }
      }
    }
  }

  loadDelivery();
</script>

</body>
</html>
