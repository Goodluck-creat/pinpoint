<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PinPoint — Track your delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #FAFBFC;
    --surface: #FFFFFF;
    --ink: #0F172A;
    --slate: #64748B;
    --slate-light: #94A3B8;
    --border: #E5E9F0;
    --primary: #2454FF;
    --primary-dark: #1A3FD1;
    --primary-tint: #EEF2FF;
    --live: #00C896;
    --live-tint: #E6FBF4;
    --warn: #F59E0B;
    --warn-tint: #FFF7E6;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  h1, h2, h3, .display {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.01em;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 20;
  }

  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--primary), #5B7FFF);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 16px; height: 16px; }
  .brand-name { font-size: 16px; font-weight: 700; }

  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 18px 16px 50px;
  }

  .empty-state {
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    padding: 50px 24px;
    text-align: center;
    color: var(--slate);
    font-size: 14px;
    margin-top: 40px;
  }

  /* ---------- Delivery header card ---------- */
  .delivery-header {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
  }

  .delivery-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .delivery-code { font-size: 13px; color: var(--slate); }

  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .tag.assigned { background: #FFF7E6; color: #B7791F; }
  .tag.accepted { background: var(--primary-tint); color: var(--primary); }
  .tag.live { background: var(--live-tint); color: #067A5C; }
  .tag.delivered { background: #F1F5F9; color: var(--slate); }

  .rider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }

  .rider-avatar-sm {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--primary-tint);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .rider-avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

  .rider-name { font-size: 14px; font-weight: 600; }
  .rider-vehicle { font-size: 12px; color: var(--slate); }

  /* ---------- Map ---------- */
  #map {
    width: 100%;
    height: 320px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 14px;
    background: #E5E9F0;
  }

  .rider-marker {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 3px solid var(--primary);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(36,84,255,0.3);
    overflow: hidden;
    font-size: 18px;
  }
  .rider-marker img { width: 100%; height: 100%; object-fit: cover; }

  /* ---------- Stats row ---------- */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--slate-light);
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }

  /* ---------- Wrong direction banner ---------- */
  .wrong-direction-banner {
    background: #FEF2F2;
    border: 1.5px solid #FCA5A5;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
    color: #B91C1C;
  }
  .wrong-direction-banner.visible { display: flex; }

  /* ---------- Consent request button ---------- */
  .track-btn {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .track-btn:hover { background: var(--primary-dark); }
  .track-btn:disabled { background: var(--slate-light); cursor: not-allowed; }

  .waiting-note {
    text-align: center;
    font-size: 13px;
    color: var(--slate);
    padding: 12px;
    background: var(--primary-tint);
    border-radius: 10px;
    margin-bottom: 14px;
  }

  .live-note {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #067A5C;
    background: var(--live-tint);
    padding: 10px 14px;
    border-radius: 9px;
    margin-bottom: 14px;
  }

  .pulse-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--live);
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(0, 200, 150, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(0, 200, 150, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 200, 150, 0); }
  }

  .route-text {
    font-size: 13px;
    color: var(--slate);
    line-height: 1.5;
  }
  .route-text .label { color: var(--slate-light); }

  .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    background: #25D366;
    color: #fff;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    margin-top: 10px;
    text-decoration: none;
    box-shadow: 0 2px 8px rgba(37, 211, 102, 0.25);
  }
  .whatsapp-btn:hover { background: #1EBE59; }
  .whatsapp-btn svg { width: 17px; height: 17px; fill: #fff; flex-shrink: 0; }
</style>
</head>
<body>

<header>
  <div class="brand-mark">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 12 8 12s8-6.75 8-12c0-4.42-3.58-8-8-8z" fill="white"/><circle cx="12" cy="10" r="3" fill="#2454FF"/></svg>
  </div>
  <span class="brand-name">PinPoint</span>
</header>

<div class="container" id="container">
  <div class="empty-state" id="loading-state">Looking up your delivery…</div>
</div>

<script>
  // ====== CONFIGURE THIS (same project as business.html / rider.html) ======
  const SUPABASE_URL = 'YOUR_SUPABASE_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  // ============================================================================

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const container = document.getElementById('container');
  const params = new URLSearchParams(window.location.search);
  const deliveryCode = params.get('code');

  let delivery = null;
  let map = null;
  let riderMarker = null;
  let realtimeChannel = null;
  let pollTimer = null;
  let offRouteStreak = 0; // counts consecutive "off route" pings

  const statusLabels = {
    assigned: 'Assigned',
    accepted: 'Accepted',
    tracking_requested: 'Tracking requested',
    tracking_approved: 'Tracking live',
    picked_up: 'Picked up',
    in_transit: 'In transit',
    arriving: 'Arriving',
    delivered: 'Delivered'
  };

  function tagClass(d) {
    if (d.status === 'delivered') return 'delivered';
    if (d.tracking_approved) return 'live';
    if (d.status === 'assigned') return 'assigned';
    return 'accepted';
  }

  function toWhatsAppNumber(phone) {
    if (!phone) return null;
    let digits = phone.replace(/\D/g, '');
    if (digits.startsWith('0')) {
      digits = '234' + digits.slice(1);
    } else if (!digits.startsWith('234')) {
      digits = '234' + digits;
    }
    return digits;
  }

  function whatsappButton(phone, message, label) {
    const number = toWhatsAppNumber(phone);
    if (!number) return '';
    const url = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
    return `
      <a href="${url}" target="_blank" class="whatsapp-btn">
        <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2m0 1.67c2.2 0 4.26.86 5.82 2.42a8.225 8.225 0 012.41 5.83c0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.188 8.188 0 01-1.25-4.37c0-4.54 3.7-8.25 8.25-8.25M8.53 7.33c-.16 0-.43.06-.66.31-.22.25-.86.84-.86 2.05 0 1.21.88 2.38 1 2.54.12.17 1.74 2.67 4.28 3.74.6.26 1.06.41 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.46-.6 1.67-1.18.21-.58.21-1.07.15-1.18-.06-.1-.23-.17-.48-.29-.25-.13-1.46-.72-1.69-.8-.23-.08-.39-.13-.56.13-.16.25-.64.8-.78.97-.15.16-.29.18-.54.06-.25-.13-1.05-.39-2-1.24-.74-.66-1.24-1.47-1.39-1.72-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.44.12-.14.16-.25.24-.41.08-.17.04-.31-.02-.44-.06-.13-.56-1.36-.78-1.85-.2-.48-.41-.42-.56-.43-.15-.01-.32-.01-.48-.01z"/></svg>
        ${label || 'Send via WhatsApp'}
      </a>`;
  }

  // ---------- Distance / geo helpers ----------
  function haversineKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
      Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // Perpendicular distance (km) from a point to the straight line between two points
  function distanceFromRouteKm(lat, lng, lat1, lng1, lat2, lng2) {
    const d13 = haversineKm(lat1, lng1, lat, lng);
    const bearing13 = bearing(lat1, lng1, lat, lng);
    const bearing12 = bearing(lat1, lng1, lat2, lng2);
    const angle = (bearing13 - bearing12) * Math.PI / 180;
    return Math.abs(Math.asin(Math.sin(d13 / 6371) * Math.sin(angle)) * 6371);
  }

  function bearing(lat1, lng1, lat2, lng2) {
    const y = Math.sin((lng2 - lng1) * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180);
    const x = Math.cos(lat1 * Math.PI / 180) * Math.sin(lat2 * Math.PI / 180) -
      Math.sin(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.cos((lng2 - lng1) * Math.PI / 180);
    return Math.atan2(y, x) * 180 / Math.PI;
  }

  // ---------- Load delivery ----------
  async function loadDelivery() {
    if (!deliveryCode) {
      container.innerHTML = `<div class="empty-state">No delivery code provided. Check the link and try again.</div>`;
      return;
    }

    const { data, error } = await supabaseClient
      .from('deliveries')
      .select('*, riders(name, photo_url, vehicle_type, phone)')
      .eq('delivery_code', deliveryCode)
      .limit(1);

    if (error || !data || data.length === 0) {
      container.innerHTML = `<div class="empty-state">We couldn't find a delivery with code ${deliveryCode}.</div>`;
      return;
    }

    delivery = data[0];
    renderPage();

    if (!pollTimer) {
      pollTimer = setInterval(refreshDeliveryStatus, 4000);
    }
  }

  async function refreshDeliveryStatus() {
    const { data } = await supabaseClient
      .from('deliveries')
      .select('*, riders(name, photo_url, vehicle_type, phone)')
      .eq('delivery_code', deliveryCode)
      .limit(1);
    if (data && data.length > 0) {
      const wasApproved = delivery.tracking_approved;
      delivery = data[0];
      updateHeaderCard();
      updateActionArea();
      if (delivery.tracking_approved && !wasApproved) {
        startLiveTracking();
      }
    }
  }

  function renderPage() {
    const rider = delivery.riders || {};
    const avatarContent = rider.photo_url
      ? `<img src="${rider.photo_url}" alt="${rider.name}">`
      : '🏍️';

    container.innerHTML = `
      <div class="delivery-header" id="delivery-header">
        <div class="delivery-top">
          <span class="delivery-code mono">${delivery.delivery_code}</span>
          <span class="tag ${tagClass(delivery)}" id="status-tag">${statusLabels[delivery.status] || delivery.status}</span>
        </div>
        <div class="route-text">
          <span class="label">Pickup:</span> ${delivery.pickup_address}<br>
          <span class="label">Destination:</span> ${delivery.destination_address}
        </div>
        <div class="rider-row">
          <div class="rider-avatar-sm">${avatarContent}</div>
          <div>
            <div class="rider-name">${rider.name || 'Rider not assigned yet'}</div>
            <div class="rider-vehicle">${rider.vehicle_type || ''}</div>
          </div>
        </div>
      </div>

      <div id="action-area"></div>

      <div class="wrong-direction-banner" id="wrong-direction-banner">
        ⚠️ The rider appears to have moved off the expected route.
      </div>

      <div id="map"></div>

      <div class="stats-row" id="stats-row" style="display:none;">
        <div class="stat-card">
          <div class="stat-label">Distance to you</div>
          <div class="stat-value" id="stat-distance">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Est. arrival</div>
          <div class="stat-value" id="stat-eta">—</div>
        </div>
      </div>
    `;

    initMap();
    updateActionArea();
  }

  function updateHeaderCard() {
    const tagEl = document.getElementById('status-tag');
    if (tagEl) {
      tagEl.textContent = statusLabels[delivery.status] || delivery.status;
      tagEl.className = `tag ${tagClass(delivery)}`;
    }
  }

  function updateActionArea() {
    const actionArea = document.getElementById('action-area');
    if (!actionArea) return;

    if (delivery.status === 'delivered') {
      actionArea.innerHTML = `<div class="live-note">✅ This delivery has been completed.</div>`;
      return;
    }

    if (delivery.tracking_approved) {
      actionArea.innerHTML = `<div class="live-note"><span class="pulse-dot"></span>Live tracking active</div>`;
      document.getElementById('stats-row').style.display = 'grid';
      return;
    }

    if (delivery.tracking_requested) {
      const rider = delivery.riders || {};
      let waHtml = '';
      if (rider.phone) {
        const riderUrl = `${window.location.origin}/rider.html`;
        const message = `Hi ${rider.name || ''}, ${delivery.customer_name} wants to view your live location for delivery ${delivery.delivery_code}. Open your rider page to approve: ${riderUrl}`;
        waHtml = whatsappButton(rider.phone, message, `Notify ${rider.name || 'rider'} via WhatsApp`);
      }
      actionArea.innerHTML = `<div class="waiting-note">Waiting for the rider to approve live tracking…</div>${waHtml}`;
      return;
    }

    actionArea.innerHTML = `<button class="track-btn" id="request-tracking-btn">Request live tracking</button>`;
    const btn = document.getElementById('request-tracking-btn');
    if (btn) {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        btn.textContent = 'Requesting…';
        await supabaseClient
          .from('deliveries')
          .update({ tracking_requested: true, status: 'tracking_requested' })
          .eq('id', delivery.id);
        delivery.tracking_requested = true;
        updateActionArea();
      });
    }
  }

  // ---------- Map ----------
  function initMap() {
    const rider = delivery.riders || {};
    const hasPickup = delivery.pickup_lat && delivery.pickup_lng;
    const hasDestination = delivery.destination_lat && delivery.destination_lng;
    const centerLat = hasDestination ? delivery.destination_lat : (hasPickup ? delivery.pickup_lat : 6.5244);
    const centerLng = hasDestination ? delivery.destination_lng : (hasPickup ? delivery.pickup_lng : 3.3792);

    map = L.map('map').setView([centerLat, centerLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    if (hasPickup) {
      L.circleMarker([delivery.pickup_lat, delivery.pickup_lng], {
        radius: 7, color: '#0F172A', fillColor: '#0F172A', fillOpacity: 1
      }).addTo(map).bindPopup('Pickup');
    }
    if (hasDestination) {
      L.circleMarker([delivery.destination_lat, delivery.destination_lng], {
        radius: 7, color: '#00C896', fillColor: '#00C896', fillOpacity: 1
      }).addTo(map).bindPopup('Destination');
    }

    if (hasPickup && hasDestination) {
      L.polyline([[delivery.pickup_lat, delivery.pickup_lng], [delivery.destination_lat, delivery.destination_lng]], {
        color: '#2454FF', weight: 3, dashArray: '6 8', opacity: 0.4
      }).addTo(map);
      map.fitBounds([[delivery.pickup_lat, delivery.pickup_lng], [delivery.destination_lat, delivery.destination_lng]], { padding: [30, 30] });
    }

    if (delivery.tracking_approved) {
      startLiveTracking();
    }
  }

  function riderDivIcon() {
    const rider = delivery.riders || {};
    const content = rider.photo_url ? `<img src="${rider.photo_url}">` : '🏍️';
    return L.divIcon({
      html: `<div class="rider-marker">${content}</div>`,
      className: '',
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });
  }

  function updateStats(lat, lng, speedMs) {
    if (!delivery.destination_lat || !delivery.destination_lng) return;
    const distKm = haversineKm(lat, lng, delivery.destination_lat, delivery.destination_lng);
    document.getElementById('stat-distance').textContent = distKm < 1
      ? `${Math.round(distKm * 1000)} m`
      : `${distKm.toFixed(1)} km`;

    // Estimate speed: use live GPS speed if available and moving, else assume 20km/h (typical bike in traffic)
    const speedKmh = (speedMs && speedMs > 1) ? speedMs * 3.6 : 20;
    const etaMinutes = Math.max(1, Math.round((distKm / speedKmh) * 60));
    document.getElementById('stat-eta').textContent = `${etaMinutes} min`;
  }

  function checkWrongDirection(lat, lng) {
    const banner = document.getElementById('wrong-direction-banner');
    if (!banner) return;
    if (!delivery.pickup_lat || !delivery.destination_lat) return;

    const offsetKm = distanceFromRouteKm(
      lat, lng,
      delivery.pickup_lat, delivery.pickup_lng,
      delivery.destination_lat, delivery.destination_lng
    );

    // More than ~350m off the direct pickup→destination line counts as "off route"
    if (offsetKm > 0.35) {
      offRouteStreak++;
    } else {
      offRouteStreak = 0;
    }

    // Require a few consecutive off-route pings before warning, to absorb GPS noise
    banner.classList.toggle('visible', offRouteStreak >= 3);
  }

  function startLiveTracking() {
    if (!map) return;
    if (!riderMarker) {
      const rider = delivery.riders || {};
      const startLat = delivery.pickup_lat || 6.5244;
      const startLng = delivery.pickup_lng || 3.3792;
      riderMarker = L.marker([startLat, startLng], { icon: riderDivIcon() }).addTo(map);
    }

    // Fetch the most recent ping immediately
    fetchLatestPing();

    if (realtimeChannel) return; // already subscribed

    realtimeChannel = supabaseClient
      .channel(`location-${delivery.id}`)
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'location_pings', filter: `delivery_id=eq.${delivery.id}` },
        (payload) => {
          applyPing(payload.new);
        }
      )
      .subscribe();
  }

  async function fetchLatestPing() {
    const { data } = await supabaseClient
      .from('location_pings')
      .select('*')
      .eq('delivery_id', delivery.id)
      .order('created_at', { ascending: false })
      .limit(1);
    if (data && data.length > 0) {
      applyPing(data[0]);
    }
  }

  function applyPing(ping) {
    if (!riderMarker) return;
    riderMarker.setLatLng([ping.lat, ping.lng]);
    map.panTo([ping.lat, ping.lng]);
    updateStats(ping.lat, ping.lng, ping.speed);
    checkWrongDirection(ping.lat, ping.lng);
  }

  loadDelivery();
</script>

</body>
</html>
